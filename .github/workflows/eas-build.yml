name: "EAS Build Reusable"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string # staging | production
      profile:
        required: true
        type: string # preview | production | development
      platform:
        required: true
        type: string # android | ios | all
      submit:
        required: false
        type: boolean
        default: false # Only submit on production
      release_notes:
        required: false
        type: string
        default: "Bug fixes and performance improvements."
    secrets:
      EXPO_TOKEN:
        required: true
      DOTENV_ME:
        required: false
      ASC_APP_ID:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install deps
        run: npm ci

      - name: Pull app env from Env Vault (no browser) + persist
        shell: bash
        run: |
          # Pull environment variables from the vault into the .env file
          npx dotenv-vault@latest pull "${{ inputs.environment }}" .env --yes --dotenvMe="${{ secrets.DOTENV_ME }}"

          # List all the environment keys pulled from the .env file
          echo "Loaded env keys:"
          cut -d= -f1 .env | sed 's/^/- /'

          # Load the environment variables into the shell for later use (optional)
          set -a
          source .env
          set +a

          # Dynamically persist all environment variables into $GITHUB_ENV (optional, if you need them later)
          persist () {
            name="$1"; val="${!1:-}"
            if [ -n "$val" ]; then
              printf '%s=%s\n' "$name" "$val" >> "$GITHUB_ENV"
            else
              echo "::warning::$name not set; will be missing in later steps"
            fi
          }

          while IFS='=' read -r name value; do
            if [[ -z "$name" || "$name" == \#* ]]; then
              continue
            fi
            persist "$name"
          done < .env

      - name: Push env to EAS (from .env file)
        shell: bash
        run: |
          echo "Pushing .env to EAS environment: ${{ inputs.profile }}"
          echo "Preview of keys in .env:"
          grep -v '^\s*#' .env | cut -d= -f1 | sed 's/^/- /'

          # EAS CLI expects .env.local by default
          cp .env .env.local 
          # Push env vars and overwrite existing ones without prompting
          eas env:push "${{ inputs.profile }}" --force

      - name: Write release notes for Play Store
        if: ${{ inputs.submit && inputs.environment == 'production' }}
        shell: bash
        run: |
          mkdir -p release-notes
          printf '%s' "${{ inputs.release_notes }}" > release-notes/en-US.txt
          echo "Release notes:"
          cat release-notes/en-US.txt

      - name: Build on EAS
        run: |
          if [[ "${{ inputs.platform }}" == "all" ]]; then
            eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
            eas build --platform ios --profile ${{ inputs.profile }} --non-interactive --no-wait
          else
            eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait
          fi

      - name: Submit to Play Store / App Store (optional)
        if: ${{ inputs.submit && inputs.environment == 'production' }}
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
        run: |
          # Inject ascAppId into eas.json submit profile at runtime so it never lives in source
          if [[ -n "$ASC_APP_ID" ]]; then
            node -e "
              const fs = require('fs');
              const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
              eas.submit = eas.submit || {};
              eas.submit['${{ inputs.profile }}'] = eas.submit['${{ inputs.profile }}'] || {};
              eas.submit['${{ inputs.profile }}'].ios = eas.submit['${{ inputs.profile }}'].ios || {};
              eas.submit['${{ inputs.profile }}'].ios.ascAppId = process.env.ASC_APP_ID;
              fs.writeFileSync('eas.json', JSON.stringify(eas, null, 2));
            "
          fi
          eas submit -p ${{ inputs.platform }} --latest --profile ${{ inputs.profile }} --non-interactive --no-wait
